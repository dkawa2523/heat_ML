version: 1
nodes:
  - {name: CP, heat_capacity: 1.00}
  - {name: Center, heat_capacity: 1.20}
  - {name: middle, heat_capacity: 1.35}
  - {name: edge, heat_capacity: 1.50}
actuators:
  - {name: brine, tau: 3.0}
  - {name: heater, tau: 5.0}
  - {name: plasma, tau: 1.0}
edges:
  - {nodes: [CP, Center], conductance: 0.05625}
  - {nodes: [Center, middle], conductance: 0.08182}
  - {nodes: [middle, edge], conductance: 0.06923}
  - {nodes: [Center, edge], conductance: 0.02813}
sources:
  - name: plasma_heating
    actuator: plasma
    node_weights: {CP: 0.70, Center: 0.60, middle: 0.45, edge: 0.30}
    gain: 0.01
  - name: heater_heating
    actuator: heater
    node_weights: {CP: 0.25, Center: 0.70, middle: 0.60, edge: 0.45}
    gain: 0.014
    threshold: 70.0
boundaries:
  - name: brine_cooling
    actuator: brine
    temperature_intercept: 55.0
    temperature_slope: -0.45
    node_weights: {CP: 0.20, Center: 0.25, middle: 0.45, edge: 0.75}
    conductance: 0.03
  - name: ambient
    temperature_intercept: 45.0
    node_weights: {CP: 1.0, Center: 1.0, middle: 1.0, edge: 1.0}
    conductance: 0.004
sensors:
  - {name: CP, node: CP}
  - {name: Center, node: Center}
  - {name: middle, node: middle}
  - {name: edge, node: edge}
