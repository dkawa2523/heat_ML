seed: 42

project:
  run_name: thermal_network_demo
  output_dir: work/outputs/runs
  overwrite_run: true

data:
  directory: data/raw
  pattern: "*.csv"
  time_col: time
  control_convention: left
  sep: ","
  dt: 1.0
  temp_min: -50.0
  temp_max: 300.0

split:
  method: random
  train_ratio: 0.70
  val_ratio: 0.15

system: system.yaml

engine:
  integrator: exact

training:
  epochs: 30
  batch_size: 8
  horizon: null
  learning_rate: 0.03
  huber_delta: 1.0
  initial_temperature_prior_std: 50.0
  prior_weight: 0.0001
  gradient_clip: 10.0
  validation_every: 5
  patience: 8

forecast:
  input_dir: data/pred/forecast
  pattern: "*.csv"
  output_dir: work/outputs/forecast
  overwrite: true
  device: cpu

monitor:
  input_dir: data/pred/monitor
  pattern: "*.csv"
  output_dir: work/outputs/monitor
  overwrite: true
  device: cpu
  observer:
    # Omit bias_reference when no calibrated sensor is available; bias is then zero-mean.
    disturbance_process_std: 0.02
    bias_process_std: 0.005
    sensor_std: 0.15
    innovation_gate_sigma: 4.0
