seed: 42

project:
  run_name: topcell
  output_dir: work/outputs/runs
  overwrite_run: true

data:
  directory: work/data/raw
  pattern: "*.csv"
  time_col: time
  control_convention: left
  sep: ","
  # Set to null for genuinely variable-step CAE exports.
  dt: 1.0
  temp_min: -20.0
  temp_max: 300.0

split:
  method: random
  train_ratio: 0.70
  val_ratio: 0.15

system: system.yaml

engine:
  integrator: exact

training:
  epochs: 20
  batch_size: 12
  horizon: null
  learning_rate: 0.03
  huber_delta: 1.0
  prior_weight: 0.0001
  gradient_clip: 10.0
  validation_every: 5
  patience: 8

forecast:
  input_dir: work/data/eval/forecast
  pattern: "*.csv"
  output_dir: work/outputs/forecast
  overwrite: true
  device: cpu

monitor:
  input_dir: work/data/eval/monitor
  pattern: "*.csv"
  output_dir: work/outputs/monitor
  overwrite: true
  device: cpu
  observer:
    # No calibrated sensor exists in this benchmark, so sensor bias uses a zero-mean gauge.
    disturbance_process_std: 0.02
    bias_process_std: 0.005
    sensor_std: 0.15
    innovation_gate_sigma: 4.0
