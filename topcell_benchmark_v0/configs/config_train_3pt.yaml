project:
  seed: 42
  run_name: graph_rc_topcell_3pt_v0
  output_dir: outputs/runs
  overwrite_run: true

data:
  raw_dir: data/raw
  file_pattern: "temp_*.csv"
  filename_regex: 'temp_(?P<brine>[-+0-9.eE]+)_(?P<heater>[-+0-9.eE]+)_(?P<plasma>[-+0-9.eE]+)(?:_.*)?\.csv'
  columns: [time, CP, Center, middle, edge]
  sensor_cols: [Center, middle, edge]
  control_cols: [brine, heater, plasma]
  sep: "[\\s,]+"
  header: auto
  dt: 1.0
  temp_min: -20.0
  temp_max: 300.0

split:
  method: random
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

features:
  history_steps: 8
  target: delta_temperature
  use_effective_controls: true
  control_lag_tau:
    brine: 4.0
    heater: 8.0
    plasma: 1.0

model:
  name: graph_rc
  hidden_dim: 16
  dropout: 0.05
  residual_scale: 0.02
  graph:
    node_table: configs/cell_nodes.csv
    edge_table: configs/cell_edges.csv
    symmetric: true
    init_from_resistance: true
    learn_conductance: false
    ignore_unknown_edges: true
    conduction_scale: 0.05
    use_source_prior: true
    source_prior_scale: 0.05
    control_signs:
      brine: -1.0
      heater: 1.0
      plasma: 1.0

train:
  epochs: 60
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 15
  gradient_clip: 1.0
  print_every: 10
  device: auto
  num_threads: 1
  rollout_loss_weight: 0.0
  rollout_loss_steps: 3
  graph_prior_loss_weight: 0.0

evaluation:
  make_plots: true
  max_plots_per_split: 3
  dynamic_case_keywords: [step, ramp, pulse, recipe, schedule]

compare:
  runs_dir: outputs/runs
  output: outputs/model_leaderboard.csv
