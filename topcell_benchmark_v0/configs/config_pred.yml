model_package:
  path: outputs/runs/graph_rc_topcell_v0/model_package

prediction:
  # forecast: open-loop rollout from initial temperatures.
  # monitor: one-step residual monitoring from measured temperature logs.
  mode: forecast
  input_table: data/pred/conditions.csv
  output_dir: outputs/predictions_graph_rc
  default_dt: 1.0
  default_t_end: 180.0
  allow_dt_mismatch: false
  warn_if_longer_than_train: true
  schedule_interpolation: previous
  resample:
    enabled: false
    dt: 1.0
    temperature: linear
    control: previous
  max_control_step:
    brine: 20.0
    heater: 100.0
    plasma: 150.0
  device: cpu
  num_threads: 1
  clamp_temperature:
    enabled: true
    min: -20.0
    max: 300.0

  correction:
    enabled: false
    mode: none        # none, offset, offset_ema
    artifact: ""      # residuals command creates outputs/residual_analysis/offset_correction.json
    max_abs_correction: 2.0
    offset_values: {}
    ema:
      alpha: 0.03
      warmup_steps: 0

postprocess:
  make_plots: true

compare:
  runs_dir: outputs/runs
  output: outputs/model_leaderboard.csv

residuals:
  input_dir: outputs/predictions_graph_rc
  output_dir: outputs/residual_analysis
  file_pattern: "*_monitor.csv"
  interval_quantile: 0.90
  max_abs_correction: 2.0
