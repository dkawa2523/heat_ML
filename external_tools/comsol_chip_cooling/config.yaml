seed: 42

project:
  run_name: comsol_chip_cooling
  output_dir: work/outputs/runs
  overwrite_run: true

data:
  directory: data/train
  pattern: "*.csv"
  time_col: time
  control_convention: left
  sep: ","
  dt: 2.0
  temp_min: -50.0
  temp_max: 200.0

# Thermal impedance is opt-in: absorbed heat steps and qualification limits are
# stated explicitly instead of being guessed from filenames or command units.
analysis:
  thermal_impedance:
    baseline_window_s: 40.0
    terminal_window_s: 60.0
    max_baseline_drift_k_per_s: 0.00001
    max_baseline_std_k: 0.001
    max_terminal_zth_drift_k_per_w_s: 0.001
    steps:
      T01_power_step_4w:
        {control: chip_power, transition_start_s: 60.0, transition_end_s: 64.0,
         heat_step_w: 4.0}
      T02_power_step_6w:
        {control: chip_power, transition_start_s: 60.0, transition_end_s: 64.0,
         heat_step_w: 6.0}
      T03_power_step_8w:
        {control: chip_power, transition_start_s: 60.0, transition_end_s: 64.0,
         heat_step_w: 8.0}
      T04_power_step_10w:
        {control: chip_power, transition_start_s: 60.0, transition_end_s: 64.0,
         heat_step_w: 10.0}
      T05_power_step_12w:
        {control: chip_power, transition_start_s: 60.0, transition_end_s: 64.0,
         heat_step_w: 12.0}

split:
  method: random
  train_ratio: 0.75
  val_ratio: 0.125

system: system.yaml

engine:
  integrator: exact

training:
  epochs: 120
  batch_size: 8
  horizon: null
  learning_rate: 0.02
  huber_delta: 1.0
  initial_temperature_prior_std: 50.0
  prior_weight: 0.0001
  gradient_clip: 10.0
  validation_every: 5
  patience: 12

forecast:
  input_dir: data/eval/forecast
  pattern: "*.csv"
  output_dir: work/outputs/forecast
  overwrite: true
  device: cpu

monitor:
  input_dir: data/eval/monitor
  pattern: "*.csv"
  output_dir: work/outputs/monitor
  overwrite: true
  device: cpu
  observer:
    # COMSOL truth represents a calibrated fins sensor in these evaluation logs.
    bias_reference: fins
    disturbance_process_std: 0.02
    bias_process_std: 0.005
    sensor_std: 0.15
    innovation_gate_sigma: 4.0
